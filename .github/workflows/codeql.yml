# Analyse CodeQL (requêtes security-extended). Gratuite pour les dépôts
# publics seulement : les appelants la conditionnent à la visibilité du dépôt.
name: codeql

on:
  workflow_call:
    inputs:
      langages:
        description: Liste JSON des langages CodeQL.
        type: string
        default: '["rust", "actions"]'

permissions: {}

jobs:
  analyse:
    name: CodeQL (${{ matrix.langage }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        langage: ${{ fromJSON(inputs.langages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.langage }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.langage }}
