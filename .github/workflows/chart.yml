# Vérifie les charts Helm d'un dossier ; sur main et les tags, les publie en OCI
# sur ghcr.io et les signe (cosign sans clé).
name: chart

on:
  workflow_call:
    inputs:
      directory:
        description: Dossier qui contient un sous-dossier par chart.
        type: string
        default: charts
      publish:
        description: Publier et signer (à réserver aux push sur main et aux tags).
        type: boolean
        default: false

permissions: {}

jobs:
  chart:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CHARTS_DIR: ${{ inputs.directory }}
      OCI_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: helm lint et rendu
        run: |
          mkdir -p rendered
          for c in "$CHARTS_DIR"/*/; do
            n=$(basename "$c")
            opts=()
            if [ -f "$c/ci/test-values.yaml" ]; then opts=(-f "$c/ci/test-values.yaml"); fi
            helm lint --strict "${opts[@]}" "$c"
            helm template "$n" "$c" "${opts[@]}" > "rendered/$n.yaml"
          done
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD/rendered:/rendered:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -ignore-missing-schemas /rendered
      - name: kube-linter
        run: |
          docker run --rm -v "$PWD/rendered:/rendered:ro" \
            stackrox/kube-linter@sha256:f2bfce7879206d32f69ab6572c376f916643f54ca291ac38cf7d01ef591ff3f9 \
            lint /rendered
      - name: Connexion à ghcr.io
        if: inputs.publish
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: inputs.publish
        with:
          tool: cosign@3.1.4
      - name: Publication et signature
        if: inputs.publish
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          mkdir -p packages
          for c in "$CHARTS_DIR"/*/; do helm package "$c" -d packages; done
          for p in packages/*.tgz; do
            out=$(helm push "$p" "oci://$OCI_REPO" 2>&1); echo "$out"
            ref=$(echo "$out" | awk '/^Pushed:/{print $2}')
            digest=$(echo "$out" | awk '/^Digest:/{print $2}')
            cosign sign --yes "${ref%:*}@$digest"
          done
