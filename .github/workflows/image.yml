# Construit une image sur une base dhi.io, la publie sur ghcr.io avec SBOM et
# provenance, la scanne, puis la signe (cosign sans clé). La signature vaut
# approbation : le cluster refuse une image non signée (Kyverno, beta1-helm).
# À n'appeler que sur push (main, tags) : les PR de forks n'ont pas les secrets.
name: image

on:
  workflow_call:
    inputs:
      nom:
        description: Nom de l'image (ghcr.io/labatailledefrance/<nom>).
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      contexte:
        type: string
        default: .
    secrets:
      DHI_USERNAME:
        required: true
      DHI_TOKEN:
        required: true
    outputs:
      digest:
        description: Digest de l'image publiée.
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.construire.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.nom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Connexion à dhi.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Connexion à ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: construire
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.contexte }}
          file: ${{ inputs.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: trivy@0.76.2,cosign@3.1.4
      - name: Scan (bloque les vulnérabilités critiques ou élevées corrigeables)
        env:
          DIGEST: ${{ steps.construire.outputs.digest }}
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE@$DIGEST"
      - name: Signature (cosign sans clé)
        env:
          DIGEST: ${{ steps.construire.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.construire.outputs.digest }}
          push-to-registry: true
